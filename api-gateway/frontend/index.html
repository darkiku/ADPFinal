<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aitu SuperApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.4s ease-out forwards',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(15px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Скрываем скроллбар для красоты */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .glass-header {
            background: rgba(30, 58, 138, 0.95);
            backdrop-filter: blur(10px);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeInUp 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-100 flex justify-center h-screen overflow-hidden font-sans text-gray-800">

    <div class="w-full max-w-md bg-slate-50 shadow-2xl h-full flex flex-col relative overflow-hidden">
        
        <header class="glass-header text-white p-6 rounded-b-3xl shadow-lg z-10 sticky top-0 transition-all duration-300">
            <div class="flex justify-between items-center">
                <div>
                    <p class="text-brand-100 text-xs font-semibold tracking-wider uppercase mb-1" id="current-date">Today</p>
                    <h1 class="text-2xl font-bold tracking-tight">Aitu SuperApp</h1>
                </div>
                <div class="relative group cursor-pointer">
                    <div class="w-12 h-12 bg-gradient-to-tr from-brand-500 to-blue-300 rounded-full flex items-center justify-center shadow-inner border-2 border-white/20">
                        <i class="fa-solid fa-user text-white text-lg"></i>
                    </div>
                    <div class="absolute -bottom-1 -right-1 w-4 h-4 bg-green-400 border-2 border-brand-900 rounded-full"></div>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-5 pb-24 relative space-y-6" id="main-content">
            
            <div id="toast" class="fixed top-24 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-4 py-2 rounded-full shadow-lg text-sm font-medium transition-opacity duration-300 opacity-0 pointer-events-none z-50 flex items-center">
                <i id="toast-icon" class="mr-2"></i> <span id="toast-msg">Success</span>
            </div>

            <div id="tab-education" class="tab-content active space-y-5">
                
                <div class="bg-gradient-to-br from-brand-600 to-brand-800 rounded-3xl p-6 text-white shadow-lg shadow-brand-500/30 relative overflow-hidden group">
                    <div class="absolute top-0 right-0 -mt-4 -mr-4 w-32 h-32 bg-white opacity-5 rounded-full blur-2xl"></div>
                    <div class="flex justify-between items-center mb-2">
                        <h2 class="text-sm font-medium text-brand-100 opacity-90"><i class="fa-solid fa-graduation-cap mr-2"></i>Academic Standing</h2>
                        <button onclick="fetchGPA()" class="text-white/80 hover:text-white transition-transform hover:rotate-180 duration-500"><i class="fa-solid fa-rotate-right"></i></button>
                    </div>
                    <div class="flex items-end space-x-2">
                        <span id="gpa-display" class="text-5xl font-black tracking-tighter">--</span>
                        <span class="text-lg font-medium text-brand-100 mb-1">/ 4.33</span>
                    </div>
                    <p class="text-xs text-brand-100 mt-3 opacity-80" id="gpa-status">Click refresh to load GPA</p>
                </div>

                <div class="glass-card rounded-3xl p-5 shadow-sm">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-gray-800">Today's Schedule</h3>
                        <button onclick="fetchSchedule()" class="text-xs bg-brand-50 text-brand-600 px-3 py-1 rounded-full font-semibold hover:bg-brand-100 transition">Load</button>
                    </div>
                    <div id="schedule-list" class="space-y-3">
                        <div class="text-center text-gray-400 text-sm py-4 italic">Press 'Load' to fetch schedule</div>
                    </div>
                </div>
            </div>

            <div id="tab-finance" class="tab-content space-y-5">
                <div class="bg-gray-900 rounded-3xl p-6 text-white shadow-xl relative overflow-hidden">
                    <div class="absolute -right-10 -bottom-10 text-gray-800 opacity-50"><i class="fa-solid fa-wallet text-9xl"></i></div>
                    <h2 class="text-sm font-medium text-gray-400 mb-1"><i class="fa-solid fa-building-columns mr-2"></i>Campus Balance</h2>
                    <div class="flex items-center space-x-1 mb-4">
                        <span class="text-3xl font-bold">₸</span>
                        <span id="balance-display" class="text-4xl font-black tracking-tight">0.00</span>
                    </div>
                    <div class="flex space-x-3">
                        <button onclick="checkBalance()" class="flex-1 bg-white text-gray-900 font-bold py-2.5 rounded-xl shadow-sm hover:bg-gray-100 transition text-sm">Refresh</button>
                        <button onclick="initiatePayment()" class="flex-1 bg-brand-600 text-white font-bold py-2.5 rounded-xl shadow-sm hover:bg-brand-500 transition text-sm"><i class="fa-solid fa-arrow-up-right-from-square mr-1"></i> Pay</button>
                    </div>
                </div>

                <h3 class="font-bold text-gray-800 px-2">Administrative Services</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center text-center cursor-pointer hover:shadow-md transition group">
                        <div class="w-10 h-10 bg-orange-50 text-orange-500 rounded-full flex items-center justify-center mb-2 group-hover:scale-110 transition"><i class="fa-solid fa-file-lines"></i></div>
                        <span class="text-xs font-semibold text-gray-700">Documents</span>
                    </div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center text-center cursor-pointer hover:shadow-md transition group">
                        <div class="w-10 h-10 bg-teal-50 text-teal-500 rounded-full flex items-center justify-center mb-2 group-hover:scale-110 transition"><i class="fa-solid fa-bed"></i></div>
                        <span class="text-xs font-semibold text-gray-700">Dormitory</span>
                    </div>
                </div>
            </div>

            <div id="tab-community" class="tab-content space-y-5">
                
                <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
                    <h2 class="font-bold text-gray-800 mb-4"><i class="fa-solid fa-couch text-purple-500 mr-2"></i>Book Coworking Space</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="text-xs font-semibold text-gray-500 uppercase ml-1">Select Space</label>
                            <select id="space-id" class="w-full mt-1 bg-slate-50 border border-gray-200 text-gray-800 text-sm py-3 px-4 rounded-2xl focus:outline-none focus:ring-2 focus:ring-purple-500 appearance-none">
                                <option value="11111111-2222-3333-4444-555555555555">Room 101 (Quiet Zone)</option>
                                <option value="22222222-3333-4444-5555-666666666666">Room 102 (Discussion)</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-xs font-semibold text-gray-500 uppercase ml-1">Start Time</label>
                                <input type="time" id="start-time" value="10:00" class="w-full mt-1 bg-slate-50 border border-gray-200 py-3 px-4 rounded-2xl text-sm focus:ring-2 focus:ring-purple-500">
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-gray-500 uppercase ml-1">End Time</label>
                                <input type="time" id="end-time" value="12:00" class="w-full mt-1 bg-slate-50 border border-gray-200 py-3 px-4 rounded-2xl text-sm focus:ring-2 focus:ring-purple-500">
                            </div>
                        </div>
                        <button onclick="bookCoworking()" id="book-btn" class="w-full bg-purple-600 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-purple-500/30 hover:bg-purple-700 transition active:scale-95">
                            Confirm Booking
                        </button>
                    </div>
                </div>

                <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-gray-800">Campus News</h3>
                        <button onclick="fetchNews()" class="text-brand-600 text-sm font-semibold hover:underline">Refresh</button>
                    </div>
                    <div id="news-list" class="space-y-3">
                        <div class="text-center text-gray-400 text-sm py-2 italic">No news loaded.</div>
                    </div>
                </div>
            </div>

        </main>

        <nav class="bg-white border-t border-gray-100 absolute bottom-0 w-full px-6 py-4 rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.05)] z-20">
            <div class="flex justify-between items-center">
                <button onclick="switchTab('education')" id="nav-education" class="nav-btn flex flex-col items-center text-brand-600 transition">
                    <i class="fa-solid fa-book-open text-xl mb-1 transition-transform transform scale-110"></i>
                    <span class="text-[10px] font-bold">Edu</span>
                </button>
                <button onclick="switchTab('finance')" id="nav-finance" class="nav-btn flex flex-col items-center text-gray-400 hover:text-brand-500 transition">
                    <i class="fa-solid fa-wallet text-xl mb-1 transition-transform"></i>
                    <span class="text-[10px] font-bold">Finance</span>
                </button>
                <button onclick="switchTab('community')" id="nav-community" class="nav-btn flex flex-col items-center text-gray-400 hover:text-brand-500 transition">
                    <i class="fa-solid fa-users text-xl mb-1 transition-transform"></i>
                    <span class="text-[10px] font-bold">Campus</span>
                </button>
            </div>
        </nav>
    </div>

    <script>
        // --- КОНФИГУРАЦИЯ ---
        const API_URL = 'http://localhost:3000/api/v1';
        // Токен, который мы настроили в middleware API Gateway
        const AUTH_TOKEN = 'super-secret-token';
        // Хардкодный UUID студента для тестов
        const STUDENT_ID = '123e4567-e89b-12d3-a456-426614174000'; 

        // Стандартные заголовки с JWT токеном
        const headers = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${AUTH_TOKEN}`
        };

        // Установка текущей даты
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });

        // --- ЛОГИКА ВКЛАДОК (TABS) ---
        function switchTab(tabName) {
            // Скрываем все табы
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            // Сбрасываем цвета кнопок
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-brand-600');
                btn.classList.add('text-gray-400');
                btn.querySelector('i').classList.remove('scale-110');
            });

            // Активируем нужный таб
            document.getElementById(`tab-${tabName}`).classList.add('active');
            
            // Красим активную кнопку
            const activeBtn = document.getElementById(`nav-${tabName}`);
            activeBtn.classList.remove('text-gray-400');
            activeBtn.classList.add('text-brand-600');
            activeBtn.querySelector('i').classList.add('scale-110');
        }

        // --- UI УВЕДОМЛЕНИЯ (TOASTS) ---
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            const msg = document.getElementById('toast-msg');

            msg.innerText = message;
            toast.className = `fixed top-24 left-1/2 transform -translate-x-1/2 text-white px-5 py-2.5 rounded-full shadow-xl text-sm font-semibold transition-all duration-300 z-50 flex items-center ${type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-brand-500'}`;
            icon.className = type === 'success' ? 'fa-solid fa-check-circle mr-2' : type === 'error' ? 'fa-solid fa-circle-exclamation mr-2' : 'fa-solid fa-info-circle mr-2';
            
            toast.style.opacity = '1';
            toast.style.transform = 'translate(-50%, 0)';
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, -10px)';
            }, 3000);
        }

        // --- ВЗАИМОДЕЙСТВИЕ С API ---

        // 1. Получение GPA
        async function fetchGPA() {
            try {
                // Анимация загрузки
                document.getElementById('gpa-display').innerText = '...';
                
                const response = await fetch(`${API_URL}/education/gpa/${STUDENT_ID}`, { headers });
                if (!response.ok) throw new Error('Failed to fetch');
                
                const data = await response.json();
                
                // Анимация чисел
                let current = 0;
                const target = data.gpa || 0;
                const increment = target / 20;
                const display = document.getElementById('gpa-display');
                
                const timer = setInterval(() => {
                    current += increment;
                    if (current >= target) {
                        current = target;
                        clearInterval(timer);
                        showToast('GPA synchronized', 'success');
                    }
                    display.innerText = current.toFixed(2);
                }, 30);

                document.getElementById('gpa-status').innerText = "Updated just now";

            } catch (error) {
                document.getElementById('gpa-display').innerText = 'Err';
                showToast('Server connection error', 'error');
            }
        }

        // 2. Получение расписания
        async function fetchSchedule() {
            const list = document.getElementById('schedule-list');
            list.innerHTML = '<div class="text-center text-brand-500 py-2"><i class="fa-solid fa-spinner fa-spin text-xl"></i></div>';
            try {
                const response = await fetch(`${API_URL}/education/schedule/today`, { headers });
                const data = await response.json();
                const colors = ['brand-500', 'teal-500', 'purple-500', 'orange-500'];
                list.innerHTML = data.schedule.map((s, i) => `
            <div class="bg-blue-50/50 rounded-xl p-3 flex border-l-4 border-${colors[i % colors.length]} animate-fade-in-up">
                <div class="w-16 font-bold text-brand-900 text-sm">${s.time}</div>
                <div class="flex-1">
                    <div class="font-bold text-gray-800 text-sm">${s.subject}</div>
                    <div class="text-xs text-gray-500"><i class="fa-solid fa-location-dot mr-1"></i>${s.room} · ${s.type}</div>
                </div>
            </div>`).join('');
                showToast('Schedule loaded');
            } catch (error) {
                list.innerHTML = '<div class="text-center text-red-500 py-2">Error loading schedule</div>';
            }
        }

        // 3. Проверка баланса
        async function checkBalance() {
            document.getElementById('balance-display').innerText = '...';
            try {
                const response = await fetch(`${API_URL}/finance/balance/${STUDENT_ID}`, { headers });
                if (!response.ok) throw new Error('API Error');
                const data = await response.json();
                
                document.getElementById('balance-display').innerText = data.balance ? data.balance.toFixed(2) : "0.00";
                showToast('Balance refreshed', 'info');
            } catch (e) {
                document.getElementById('balance-display').innerText = "Err";
                showToast('Finance API offline', 'error');
            }
        }

        // 4. Оплата (отправляет NATS ивент в бэкенде)
        async function initiatePayment() {
            const amount = prompt("Enter amount to pay (₸):", "1500");
            if (!amount || isNaN(amount)) return;

            try {
                const response = await fetch(`${API_URL}/finance/pay`, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        user_id: STUDENT_ID,
                        amount: parseFloat(amount),
                        purpose: "Coworking Pass"
                    })
                });

                const data = await response.json();
                if (data.success || data.transaction_id) {
                    showToast(`Paid ₸${amount} successfully!`, 'success');
                    checkBalance(); // Обновляем баланс
                } else {
                    throw new Error("Payment failed");
                }
            } catch (e) {
                showToast('Payment processing failed', 'error');
            }
        }

        // 5. Бронирование коворкинга (Redis Lock)
        async function bookCoworking() {
            const spaceId = document.getElementById('space-id').value;
            const btn = document.getElementById('book-btn');
            
            // Date formatting for Go time.RFC3339
            const today = new Date().toISOString().split('T')[0];
            const startTime = `${today}T${document.getElementById('start-time').value}:00Z`;
            const endTime = `${today}T${document.getElementById('end-time').value}:00Z`;

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing...';
            btn.classList.add('opacity-80', 'cursor-not-allowed');

            try {
                const response = await fetch(`${API_URL}/community/coworking/book`, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        space_id: spaceId,
                        student_id: STUDENT_ID,
                        start_time: startTime,
                        end_time: endTime
                    })
                });

                const data = await response.json();
                if (data.success || response.ok) {
                    showToast('Space successfully locked & booked!', 'success');
                } else {
                    showToast(data.error || data.message || 'Already booked by someone else', 'error');
                }
            } catch (e) {
                showToast('Failed to acquire Redis lock', 'error');
            } finally {
                btn.innerHTML = 'Confirm Booking';
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
            }
        }

        // 6. Новости кампуса
        async function fetchNews() {
            const list = document.getElementById('news-list');
            list.innerHTML = '<div class="text-center text-brand-500 py-2"><i class="fa-solid fa-spinner fa-spin"></i></div>';
            try {
                const response = await fetch(`${API_URL}/community/news/feed`, { headers });
                const data = await response.json();
                const tagColors = {
                    'Achievement': 'bg-green-500 text-white',
                    'Campus': 'bg-brand-600 text-white',
                    'Finance': 'bg-orange-500 text-white'
                };
                list.innerHTML = data.news.map((n, i) => `
            <div class="${i < data.news.length - 1 ? 'border-b border-gray-100 pb-3 mb-3' : ''} animate-fade-in-up">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full uppercase ${tagColors[n.category] || 'bg-gray-200 text-gray-700'}">${n.category}</span>
                <h4 class="font-bold text-gray-800 text-sm mt-1">${n.title}</h4>
                <p class="text-xs text-gray-400 mt-0.5">${n.date}</p>
            </div>`).join('');
            } catch(e) {
                list.innerHTML = '<div class="text-center text-gray-400 text-sm py-2">Could not load news</div>';
            }
        }

        // Инициализация при загрузке
        window.onload = () => {
            fetchGPA();
            fetchSchedule();
        };
    </script>
</body>
</html>
